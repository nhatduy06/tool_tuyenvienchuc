name: Collect recruitment notices

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect notices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RSS_FEED_URL: https://tuyencongchuc.vn/feed/
          NOTICE_KEYWORDS: ${{ vars.NOTICE_KEYWORDS }}
        run: npm run collect
